name: verify
on: [push, pull_request]
jobs:
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tests/host-harness.mjs
      - run: npm run test:compat
      - run: npm pack --dry-run
